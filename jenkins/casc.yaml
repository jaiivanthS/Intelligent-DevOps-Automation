# Jenkins Configuration-as-Code. ${VARS} are read from the container environment (.env).
jenkins:
  systemMessage: "Intelligent DevOps Automation Platform - configured by JCasC. Manual UI changes are overwritten on restart."
  numExecutors: 2
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  crumbIssuer:
    standard:
      excludeClientIPFromCrumb: true
  globalNodeProperties:
    - envVars:
        env:
          - key: AWS_REGION
            value: "${AWS_REGION:-}"
          - key: ECR_REGISTRY
            value: "${ECR_REGISTRY:-}"
          - key: ECR_REPOSITORY
            value: "${ECR_REPOSITORY:-}"
          - key: APP_HOST
            value: "${APP_HOST:-}"
          - key: APP_URL
            value: "${APP_URL:-}"
          - key: PLATFORM_API_URL
            value: "${PLATFORM_API_URL:-}"
          - key: PLATFORM_INGEST_TOKEN
            value: "${PLATFORM_INGEST_TOKEN:-}"

credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: app-host-ssh
              description: "Deploy key: Jenkins -> app host (ubuntu)"
              username: ubuntu
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/run/secrets/app_deploy_key}"

unclassified:
  location:
    url: "${JENKINS_URL}"

jobs:
  - script: |
      pipelineJob('demo-app') {
        description('Build, test, scan and publish demo-app (Jenkinsfile in the repository root).')
        properties {
          disableConcurrentBuilds()
          pipelineTriggers {
            triggers {
              githubPush()
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('${GIT_REPO_URL}') }
                branches('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
      }
  - script: |
      pipelineJob('recovery') {
        description('Executes operator-approved recovery actions requested in the platform UI. Do not run manually.')
        properties {
          disableConcurrentBuilds()
        }
        parameters {
          choiceParam('ACTION', ['rollback', 'restart'], 'Approved action')
          stringParam('TARGET_IMAGE', '', 'Image to roll back to (rollback only)')
          stringParam('REQUEST_ID', '', 'Platform recovery request id')
          stringParam('INCIDENT_ID', '', 'Related incident id (optional)')
          stringParam('APPROVED_BY', '', 'Approver recorded by the platform')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('${GIT_REPO_URL}') }
                branches('*/main')
              }
            }
            scriptPath('jenkins/recovery.Jenkinsfile')
            lightweight(true)
          }
        }
      }
